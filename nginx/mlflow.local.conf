# ===========================
# HTTPS + Reverse Proxy
# ===========================
server {
    listen 443 ssl;
    server_name mlflow.local;

    ssl_certificate     /etc/nginx/ssl/mlflow.crt;
    ssl_certificate_key /etc/nginx/ssl/mlflow.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Basic auth
    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Role test endpoint
    location /test {
        default_type text/plain;
        return 200 "Authenticated as $remote_user with role $user_role\n";
    }

    # 🚀 Forward /predict directly to the Flask fraud detection API
    location /predict {
        proxy_pass http://flask_mlflow_app:5000;

        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward everything else (UI + API + static) to FastAPI RBAC proxy
    location / {
        proxy_pass http://fastapi:8000;

        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-User-Role $user_role;
    }

    location /static/ {
        proxy_pass http://fastapi:8000;

        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-User-Role $user_role;
    }
}

# ===========================
# HTTP redirect to HTTPS
# ===========================
server {
    listen 80;
    server_name mlflow.local;

    return 301 https://$host$request_uri;
}
