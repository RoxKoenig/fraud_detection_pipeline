user www-data;
worker_processes auto;
pid /run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Custom log format with role tracking
    log_format custom_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'Role=$user_role';

    access_log /var/log/nginx/access.log custom_log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_disable "msie6";

    # ----------------------------
    # Role Mapping via remote_user
    # ----------------------------
    map $remote_user $user_role {
        default        viewer;
        alice          admin;
        bob            writer;
        charlie        viewer;
    }

    map $user_role $is_admin {
        default        0;
        admin          1;
    }

    map $user_role $is_writer {
        default        0;
        admin          1;
        writer         1;
    }

    # ----------------------------
    # Proxy headers upgrade map
    # ----------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Role $user_role;

    # ✅ Only load config we mounted from host
    include /etc/nginx/conf.d/*.conf;

    # ❌ Disable conflicting system-level configs
    # include /etc/nginx/sites-enabled/*;
}

