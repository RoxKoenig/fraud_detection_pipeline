version: "3.9"

services:
  # PostgreSQL Service
  postgres:
    container_name: fraud_detection_db
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fraud_detection_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fraud_detection_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      bash -c "
      docker-entrypoint.sh postgres & sleep 5;
      until pg_isready -h localhost -U admin -d fraud_detection_db; do
        echo 'Waiting for PostgreSQL to be ready...';
        sleep 2;
      done;
      echo 'Creating mlflow database if not exists...';
      psql -U admin -d fraud_detection_db -tc \"SELECT 1 FROM pg_database WHERE datname = 'mlflow'\" | grep -q 1 || psql -U admin -d fraud_detection_db -c 'CREATE DATABASE mlflow;';
      wait"
    networks:
      - appnet

  # MLflow Server
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    container_name: mlflow_server
    ports:
      - "5001:5001"
    environment:
      BACKEND_STORE_URI: "postgresql://admin:password@fraud_detection_db:5432/mlflow"
      ARTIFACT_ROOT: "/mlflow/artifacts"
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:5001 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    command: >
      mlflow server 
      --backend-store-uri postgresql://admin:password@fraud_detection_db:5432/mlflow 
      --default-artifact-root /mlflow/artifacts 
      --host 0.0.0.0 
      --port 5001
    networks:
      - appnet

  # Flask Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask_mlflow_app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - MLFLOW_TRACKING_URI=http://mlflow_server:5001
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks:
      - appnet

  # FastAPI RBAC Proxy
  fastapi:
    build:
      context: ./fastapi
      dockerfile: fastapi.Dockerfile
    container_name: fastapi
    environment:
      MLFLOW_BACKEND: http://mlflow_server:5001
    depends_on:
      - mlflow
    networks:
      - appnet

  # NGINX Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./nginx/mlflow.local.conf:/etc/nginx/conf.d/mlflow.local.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/ssl/mlflow.crt:/etc/nginx/ssl/mlflow.crt:ro
      - ./nginx/ssl/mlflow.key:/etc/nginx/ssl/mlflow.key:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      - fastapi
    networks:
      - appnet

volumes:
  postgres_data:
    name: fraud-detection_postgres_data
  mlflow_data:
    name: fraud-detection_mlflow_data

networks:
  appnet:
    driver: bridge
